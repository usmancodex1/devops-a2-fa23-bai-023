name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          test -f index.html || { echo "index.html missing"; exit 1; }
          test -f style.css || { echo "style.css missing"; exit 1; }

      - name: Check HTML has a title
        run: grep -q "<title>.*</title>" index.html || { echo "No <title> found"; exit 1; }

      - name: Check roll number is present
        run: grep -q "fa23-bai-023" index.html || { echo "Roll number fa23-bai-023 not found"; exit 1; }

      - name: Check main heading exists
        run: grep -q "<h1>.*</h1>" index.html || { echo "No <h1> found"; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devops-a2:latest
